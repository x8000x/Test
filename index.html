<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Game - Touch Joystick Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        /* Sprite Animation - Direction Specific */
        /* DOWN - Frames 0-2 (0px to -100px) */
        @keyframes idle-down {
            0%, 33% { background-position: 0 0; }
            33.1%, 66% { background-position: -50px 0; }
            66.1%, 100% { background-position: -100px 0; }
        }

        @keyframes walk-down {
            0%, 33% { background-position: 0 0; }
            33.1%, 66% { background-position: -50px 0; }
            66.1%, 100% { background-position: -100px 0; }
        }

        /* UP - Frames 3-5 (-150px to -250px) */
        @keyframes idle-up {
            0%, 33% { background-position: -150px 0; }
            33.1%, 66% { background-position: -200px 0; }
            66.1%, 100% { background-position: -250px 0; }
        }

        @keyframes walk-up {
            0%, 33% { background-position: -150px 0; }
            33.1%, 66% { background-position: -200px 0; }
            66.1%, 100% { background-position: -250px 0; }
        }

        /* LEFT - Frames 6-8 (-300px to -400px) */
        @keyframes idle-left {
            0%, 33% { background-position: -300px 0; }
            33.1%, 66% { background-position: -350px 0; }
            66.1%, 100% { background-position: -400px 0; }
        }

        @keyframes walk-left {
            0%, 33% { background-position: -300px 0; }
            33.1%, 66% { background-position: -350px 0; }
            66.1%, 100% { background-position: -400px 0; }
        }

        /* RIGHT - Frames 6-8 (-300px to -400px) */
        @keyframes idle-right {
            0%, 33% { background-position: -300px 0; }
            33.1%, 66% { background-position: -350px 0; }
            66.1%, 100% { background-position: -400px 0; }
        }

        @keyframes walk-right {
            0%, 33% { background-position: -300px 0; }
            33.1%, 66% { background-position: -350px 0; }
            66.1%, 100% { background-position: -400px 0; }
        }

        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            background-image: url('image/idle.png');
            background-size: 450px 50px;
            background-repeat: no-repeat;
            background-position: 0 0;
            image-rendering: pixelated;
            animation: idle-down 0.8s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        #player.flipped {
            transform: translate(-50%, -50%) scaleX(-1);
        }

        #player.walk-down {
            background-image: url('image/walk.png');
            animation: walk-down 0.6s linear infinite;
        }

        #player.walk-up {
            background-image: url('image/walk.png');
            animation: walk-up 0.6s linear infinite;
        }

        #player.walk-left {
            background-image: url('image/walk.png');
            animation: walk-left 0.6s linear infinite;
        }

        #player.walk-right {
            background-image: url('image/walk.png');
            animation: walk-right 0.6s linear infinite;
        }

        #player.idle-down {
            background-image: url('image/idle.png');
            animation: idle-down 0.8s linear infinite;
        }

        #player.idle-up {
            background-image: url('image/idle.png');
            animation: idle-up 0.8s linear infinite;
        }

        #player.idle-left {
            background-image: url('image/idle.png');
            animation: idle-left 0.8s linear infinite;
        }

        #player.idle-right {
            background-image: url('image/idle.png');
            animation: idle-right 0.8s linear infinite;
        }

        /* Joystick Styles */
        #joystickContainer {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        #joystickKnob {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 50%;
            position: absolute;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        #joystickKnob::after {
            content: '↑';
            color: white;
            font-weight: bold;
        }

        #joystickKnob.active {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.8), 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .stat-item {
            margin: 5px 0;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            #joystickContainer {
                width: 120px;
                height: 120px;
                bottom: 30px;
                left: 30px;
            }

            #joystickKnob {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <h1 class="text-3xl font-bold mb-2">🎮 Sprite Game</h1>
            <p class="text-lg">Use the joystick to move!</p>
        </div>
        
        <div id="stats">
            <div class="stat-item">Position: <span id="posX">0</span>, <span id="posY">0</span></div>
            <div class="stat-item">Direction: <span id="direction">Idle</span></div>
            <div class="stat-item">Speed: <span id="speed">0</span> px/s</div>
        </div>

        <div id="player"></div>

        <div id="joystickContainer">
            <div id="joystickKnob"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
